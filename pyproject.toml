[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlsnpdr"
version = "0.0.1"
description = "Python support package for ML-SnpDR"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = {text = "MIT"}
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24,<2.0",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3,<1.6",
  "scipy>=1.10"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
drug = ["requests>=2.31"]

[tool.setuptools]
package-dir = {"" = "inst/python"}

[tool.setuptools.packages.find]
where = ["inst/python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

